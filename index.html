<style>
/* Layout: paper card on the left holds clock/countdown, 小橘 rests on a ledge at right. Five skins swap the tokens below. Sized in vmin so it scales from laptop to 4K. */
:root{
  --bg:#5a3a24; --shelf:#3b2516; --card:#fbf3e4; --line:#eadcc4; --ink:#3b2516; --soft:#8a6a4e;
  --num:#5a3a24; --btn:#5a3a24; --btnInk:#fbf3e4; --good:#5f8a3f; --bad:#b5483c; --gold:#e0b84c;
  --credit:#8d6b4f; --zzz:#fbf3e4; --tool:rgba(251,243,228,.16); --toolInk:#fbf3e4;
  --f-display:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --f-num:"Baloo 2","Noto Sans TC",system-ui,sans-serif;
  color-scheme:light;
}
body[data-skin="night"]{--bg:#131b33;--shelf:#1d2747;--card:#1c2647;--line:#2c3a66;--ink:#f6efe2;--soft:#a9b6d3;--num:#f6efe2;--btn:#f8e3a0;--btnInk:#131b33;--good:#9d8cf0;--bad:#ff8a65;--gold:#f8e3a0;--credit:#4d5a82;--zzz:#e8e2ff;--tool:rgba(255,255,255,.1);--toolInk:#f6efe2}
body[data-skin="chalk"]{--bg:#2f4a3c;--shelf:#6e4527;--card:#36584a;--line:#4b6d5d;--ink:#f4f1e6;--soft:#c8d8c9;--num:#f4f1e6;--btn:#f2c94c;--btnInk:#2f4a3c;--good:#f4f1e6;--bad:#f2a65a;--gold:#f2c94c;--credit:#6f8f7f;--zzz:#f4f1e6;--tool:rgba(255,255,255,.12);--toolInk:#f4f1e6;--f-display:"LXGW WenKai TC","Kaiti TC",serif;--f-body:"LXGW WenKai TC","Noto Sans TC",sans-serif}
body[data-skin="minimal"]{--bg:#f3f1ec;--shelf:#e2ddd4;--card:#ffffff;--line:#ebe6dd;--ink:#26221d;--soft:#7a7268;--num:#26221d;--btn:#e8792b;--btnInk:#ffffff;--good:#3a9a6a;--bad:#d0533f;--gold:#e8792b;--credit:#c2bbb0;--zzz:#7a7268;--tool:rgba(38,34,29,.07);--toolInk:#26221d;--f-display:"Noto Sans TC",sans-serif}
body[data-skin="dream"]{--bg:#7fb2e5;--shelf:#eef5ff;--card:#f7fbff;--line:#dde9f7;--ink:#1f3a5c;--soft:#557192;--num:#1f3a5c;--btn:#3a7bd5;--btnInk:#ffffff;--good:#3a7bd5;--bad:#e8792b;--gold:#f0a640;--credit:#e9f2ff;--zzz:#ffffff;--tool:rgba(255,255,255,.6);--toolInk:#1f3a5c}
body[data-skin="shelf"]{background:#5a3a24 url(img/bg_shelf.webp) center bottom/cover no-repeat;--hudInk:#fff6e6;--hudSoft:#f3dfc0;--halo:#3b2516;--haloW:.55vmin;--glow:1.6vmin;--stateC:#ffe7b0}
body[data-skin="night"]{--hudInk:#fff8e7;--hudSoft:#d6def5;--halo:#0e1428;--haloW:.45vmin;--glow:1.4vmin;--stateC:#f8e3a0}
body[data-skin="chalk"]{--hudInk:#fbf8ee;--hudSoft:#dfe9df;--halo:#203328;--haloW:.45vmin;--glow:1.2vmin;--stateC:#f2c94c}
body[data-skin="minimal"]{--hudInk:#26221d;--hudSoft:#7a7268;--stateC:#e8792b}
body[data-skin="dream"]{--hudInk:#ffffff;--hudSoft:#ffffff;--halo:#2f5f9e;--haloW:.55vmin;--glow:1.8vmin;--stateC:#ffffff}
body[data-fuss="1"]{--stateC:#ffb43a!important}
body[data-stage="wake"]{--stateC:#ff6a4d!important}
body[data-skin="shelf"] .d-shelf{display:none}
body[data-skin="shelf"] .plank{display:none}
body[data-skin="shelf"] .cat{margin-bottom:15.5vh;--catW:54vmin}
body[data-skin="night"]{background:#0e1428 url(img/bg_night.webp) center bottom/cover no-repeat}
body[data-skin="night"] .d-night,body[data-skin="night"] .plank{display:none!important}
body[data-skin="night"] .cat{margin-bottom:28vh;--catW:46vmin}
body[data-skin="chalk"]{background:#2f4a3c url(img/bg_chalk.webp) center bottom/cover no-repeat}
body[data-skin="dream"]{background:#7fb2e5 url(img/bg_dream.webp) center bottom/cover no-repeat}
body[data-skin="camp"]{--bg:#0d1324;--shelf:#2a2216;--card:#151c30;--line:#2a3350;--ink:#fff4e3;--soft:#c9bfae;--num:#fff4e3;--btn:#f5a54a;--btnInk:#1a1208;--good:#f5c46b;--bad:#ff7a5c;--gold:#f5c46b;--credit:#4c5675;--zzz:#fff4e3;--tool:rgba(255,255,255,.1);--toolInk:#fff4e3}
body[data-skin="camp"]{background:#0d1324 url(img/bg_camp.webp) center bottom/cover no-repeat;--hudInk:#fff8ec;--hudSoft:#e9dcc6;--halo:#0a0f1c;--haloW:.45vmin;--glow:1.6vmin;--stateC:#ffcf86}
body[data-skin="camp"] .plank{display:none!important}
body[data-skin="camp"] .cat{margin-bottom:12vh;--catW:50vmin}
body[data-skin="cave"]{--bg:#081a22;--shelf:#0f2a33;--card:#0f2830;--line:#1f4450;--ink:#e9fbff;--soft:#9cc7d1;--num:#e9fbff;--btn:#ffc96b;--btnInk:#0b1f26;--good:#5fe0d0;--bad:#ff8a65;--gold:#ffc96b;--credit:#3d6470;--zzz:#e0fff9;--tool:rgba(255,255,255,.1);--toolInk:#e9fbff}
body[data-skin="cave"]{background:#081a22 url(img/bg_cave.webp) center bottom/cover no-repeat;--hudInk:#f2fffd;--hudSoft:#bfe9ef;--halo:#04131a;--haloW:.45vmin;--glow:1.6vmin;--stateC:#ffd98a}
body[data-skin="cave"] .plank{display:none!important}
body[data-skin="cave"] .cat{margin-bottom:16vh;--catW:50vmin}
body[data-skin="jungle"]{--bg:#1f3a24;--shelf:#2c4a2c;--card:#f4f8ee;--line:#dde8d2;--ink:#1e3320;--soft:#55705a;--num:#1e3320;--btn:#3f7a3a;--btnInk:#ffffff;--good:#3f7a3a;--bad:#d0533f;--gold:#e8c14c;--credit:#9bb89a;--zzz:#f1ffd8;--tool:rgba(255,255,255,.14);--toolInk:#f1f8e8}
body[data-skin="jungle"]{background:#1f3a24 url(img/bg_jungle.webp) center bottom/cover no-repeat;--hudInk:#fbfff2;--hudSoft:#e3f2cf;--halo:#12240f;--haloW:.55vmin;--glow:1.6vmin;--stateC:#f6f0a8}
body[data-skin="jungle"] .plank{display:none!important}
body[data-skin="jungle"] .cat{margin-bottom:31vh;--catW:44vmin}
body[data-skin="dream"] .d-dream,body[data-skin="dream"] .plank{display:none!important}
body[data-skin="dream"] .cat{margin-bottom:9vh}
body[data-skin="chalk"] .d-chalk,body[data-skin="chalk"] .plank{display:none!important}
body[data-skin="chalk"] .cat{margin-bottom:6vh}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);overflow:hidden;transition:background .4s}
button,input{font:inherit}
button:focus-visible,input:focus-visible{outline:.4vmin solid var(--gold);outline-offset:.3vmin}

/* decor per skin */
.decor{position:fixed;inset:0;pointer-events:none;display:none}
body[data-skin="shelf"] .d-shelf,body:not([data-skin]) .d-shelf{display:grid}
body[data-skin="night"] .d-night,body[data-skin="chalk"] .d-chalk,body[data-skin="dream"] .d-dream{display:block}
.d-shelf{grid-template-rows:repeat(3,minmax(0,1fr));gap:3.4vmin;padding:3.6vmin 5vmin;box-sizing:border-box}
.shelf{border-bottom:2.2vmin solid var(--shelf);display:flex;align-items:flex-end;justify-content:flex-end;gap:.9vmin;padding-right:6vw}
.shelf i{display:block;width:3.9vmin;border-radius:.3vmin .3vmin 0 0}
.d-night .moon{position:absolute;right:8vw;top:7vmin;width:14vmin;height:14vmin;border-radius:50%;box-shadow:-3vmin 2vmin 0 0 #f8e3a0;transform:rotate(-20deg)}
.d-night .st{position:absolute;width:.7vmin;height:.7vmin;border-radius:50%;background:#f8e3a0;opacity:.8}
.d-night .ground{position:absolute;left:0;right:0;bottom:0;height:22vh;background:#1d2747}
.d-chalk{border:3.4vmin solid #8a5a34;box-sizing:border-box;box-shadow:inset 0 0 14vmin rgba(0,0,0,.35)}
.d-chalk .tray{position:absolute;left:0;right:0;bottom:0;height:3vmin;background:#6e4527}
.d-chalk .tray i{position:absolute;bottom:.8vmin;height:1.2vmin;border-radius:.3vmin}
.d-dream .cl{position:absolute;border-radius:50%;background:#ffffff}
.dim{position:fixed;inset:0;background:#120a05;opacity:0;pointer-events:none;transition:opacity 1.5s}

.app{position:relative;height:100%;box-sizing:border-box;padding-block:4vmin;padding-left:max(16px,4.5vw,env(safe-area-inset-left,0px));padding-right:max(16px,4.5vw,env(safe-area-inset-right,0px));display:grid;grid-template-columns:minmax(0,40fr) minmax(0,60fr);gap:4vw;align-items:stretch}

.card{background:var(--card);color:var(--ink);border-radius:1.2vmin;box-shadow:0 3vmin 6vmin rgba(0,0,0,.28);padding:4.4vmin 4.4vmin 3.6vmin;display:flex;flex-direction:column;gap:2.6vmin;min-width:0;min-height:0;overflow:auto}
body[data-skin="minimal"] .card{box-shadow:none;background:transparent;padding-left:0}
.brand{display:flex;align-items:center;gap:1.8vmin}
.brand img{width:8.6vmin;height:8.6vmin;object-fit:contain;flex:none}
body[data-skin="night"] .brand img,body[data-skin="chalk"] .brand img{background:#fbf3e4;border-radius:50%;padding:.6vmin}
.brand small{display:block;font-size:2vmin;letter-spacing:.14em;color:var(--soft)}
.brand h1{margin:0;font-family:var(--f-display);font-weight:900;font-size:min(4.8vmin,3vw);line-height:1.15;text-wrap:balance}
.modes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));background:var(--line);border-radius:999px;padding:.6vmin}
.modes button{border:0;border-radius:999px;padding:1.3vmin 0;font-size:2.4vmin;font-weight:700;color:var(--soft);background:transparent;cursor:pointer}
.modes button[aria-pressed="true"]{background:var(--btn);color:var(--btnInk)}

.big{font-family:var(--f-num);font-weight:800;line-height:.9;color:var(--num);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.card{container-type:inline-size}
.clock .big{font-size:9vw;font-size:min(17vmin,29cqi);white-space:nowrap}
.clock .big span{font-size:.38em;color:var(--soft);margin-left:.4vmin}
.date{font-size:2.6vmin;color:var(--soft);font-weight:700}
.status{font-size:3.4vmin;font-weight:900}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1.4vmin}
.stat{border-top:.4vmin solid var(--line);padding-top:1.2vmin;display:flex;flex-direction:column;gap:.4vmin;min-width:0}
.stat b{font-family:var(--f-num);font-size:5vmin;line-height:1;font-variant-numeric:tabular-nums}
.stat small{font-size:1.9vmin;color:var(--soft)}

.challenge .big{font-size:10vw;font-size:min(20vmin,34cqi);white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:1.2vmin;align-items:center}
.chips{display:grid;grid-template-columns:repeat(6,minmax(0,1fr))}
.chips .custom{grid-column:span 3}
.chip{border:.35vmin solid var(--btn);background:transparent;color:var(--ink);border-radius:999px;padding:1vmin 0;font-size:2.4vmin;font-weight:700;cursor:pointer;font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--btn);color:var(--btnInk)}
.custom{display:flex;align-items:center;gap:.8vmin;font-size:2.2vmin;color:var(--soft)}
.custom input{width:8vmin;text-align:center;font-size:2.4vmin;font-weight:700;border:.35vmin solid var(--line);border-radius:1vmin;padding:.8vmin;background:var(--card);color:var(--ink)}
.primary{border:0;border-radius:999px;background:var(--bad);color:#fff;font-size:3.2vmin;font-weight:900;padding:1.8vmin 0;cursor:pointer}
body[data-skin="night"] .primary,body[data-skin="chalk"] .primary{background:var(--btn);color:var(--btnInk)}
.primary:hover{filter:brightness(1.08)}
.row{display:flex;gap:1.2vmin;flex-wrap:wrap}
.ghost{border:.35vmin solid var(--btn);background:transparent;color:var(--ink);border-radius:999px;padding:1vmin 2.6vmin;font-size:2.2vmin;font-weight:700;cursor:pointer}
.label{font-size:2vmin;font-weight:700;color:var(--soft);letter-spacing:.06em}

.meterBox{margin-top:auto;display:flex;flex-direction:column;gap:1vmin}
.meterHead{display:flex;justify-content:space-between;align-items:center;font-size:2vmin;color:var(--soft);gap:1vmin;flex-wrap:wrap}
.meter{position:relative;height:3.4vmin;border-radius:.8vmin;background:var(--line);overflow:hidden}
.meter .lvl{position:absolute;inset:0 auto 0 0;width:0;background:var(--good);transition:width .08s linear}
.meter .lvl.warn{background:var(--gold)}
.meter .lvl.loud{background:var(--bad)}
.meter .rm{position:absolute;top:0;bottom:0;width:0;border-left:.4vmin dashed var(--ink);opacity:.55;transform:translateX(-50%)}
.meter .th{position:absolute;top:0;bottom:0;width:.6vmin;background:var(--ink);transform:translateX(-50%)}
.thRow{display:flex;align-items:center;gap:1.2vmin;font-size:2vmin;color:var(--soft)}
.thRow input{flex:1;accent-color:var(--btn)}
.micBtn{border:0;background:var(--btn);color:var(--btnInk);border-radius:999px;padding:.8vmin 2vmin;font-size:1.9vmin;font-weight:700;cursor:pointer}
.mbtns{display:flex;gap:.8vmin;align-items:center}
.micBtn.alt{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 .25vmin var(--line)}
.micBtn.q{width:3.8vmin;height:3.8vmin;padding:0;font-family:var(--f-num);font-size:2.2vmin}
.micBtn.busy{background:var(--gold);color:var(--btnInk);box-shadow:none}
.calMsg{font-size:1.8vmin;color:var(--soft);min-height:2.4vmin}
.calMsg:empty{display:none}
.help .sheet{display:block;width:min(170vmin,100%)}
.hcols{column-count:2;column-gap:5vmin}
.hcols section{break-inside:avoid}
.hcols section:first-child h3{margin-top:0}
@media (min-aspect-ratio:3/2){.hcols{column-count:3}}
@media (max-aspect-ratio:1/1){.hcols{column-count:1}}
.help h2{margin:0 0 2vmin}
.help h3{margin:2.6vmin 0 .8vmin;font-size:2.8vmin;font-weight:900}
.help p,.help li{font-size:2.3vmin;line-height:1.6;margin:.4vmin 0;color:var(--ink)}
.help ul{margin:0;padding-left:3vmin}
.help .muted{color:var(--soft)}
.help table{width:100%;border-collapse:collapse;font-size:2.2vmin;margin-top:.6vmin}
.help th,.help td{text-align:left;padding:.9vmin 1.2vmin;border-bottom:.15vmin solid var(--line)}
.help th{color:var(--soft);font-weight:700}
.help .primary{padding:1.6vmin 5vmin;font-size:2.6vmin}
.help .close{margin-top:3vmin;display:flex;justify-content:flex-end}
.demo{font-size:1.9vmin;color:var(--bad);display:flex;align-items:center;gap:1vmin}
.demo input{flex:1;accent-color:var(--bad)}

.catzone{position:relative;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-top:7vmin;box-sizing:border-box}
.bubble{display:none!important}
/* HUD: streak + big state word float beside the animal, no boxes; --halo outlines text on busy backgrounds */
.hud{position:relative;z-index:3;width:min(86vmin,100%);display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:2vmin;margin-bottom:calc(var(--hudTuck,-6vmin));pointer-events:none}
.halo{paint-order:stroke fill;-webkit-text-stroke:var(--haloW,0) var(--halo,transparent);text-shadow:0 0 var(--glow,0) var(--halo,transparent)}
.stateCol{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;gap:1.2vmin;min-width:0}
.say{font-weight:800;font-size:min(3vmin,4.2vw);line-height:1.35;color:var(--hudInk,var(--ink));max-width:min(40vmin,46vw);text-align:right;opacity:0;transform:translateY(.8vmin);transition:opacity .8s,transform .8s}
.say.on{opacity:.92;transform:none}
.stateText{font-family:var(--f-display);font-weight:900;font-size:min(11vmin,15vw);line-height:1;letter-spacing:.06em;color:var(--stateC,var(--good));opacity:.62;white-space:nowrap;transition:color .4s,opacity .4s}
body[data-fuss="1"] .stateText{animation:pulse 1.1s ease-in-out infinite}
body[data-stage="wake"] .stateText{opacity:.8}
@keyframes pulse{50%{opacity:.85;transform:scale(1.04)}}
.cat{position:relative;width:min(60vmin,100%);aspect-ratio:1;max-width:100%;margin-bottom:3.5vmin}
.cat img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;transition:opacity 1.1s ease-in-out 1s;transform:translateY(calc(var(--pad,0) * 100%))}
/* fade OUT first (no delay), then the next pose fades IN after 1 s */
.cat img.out{transition:opacity 1s ease-in-out 0s}
body[data-stage="wake"] .cat img{transition-duration:.25s;transition-delay:0s}
.cat img.out{opacity:0}
.plank{position:absolute;left:4%;right:4%;bottom:4vmin;height:3vmin;background:var(--shelf);border-radius:.4vmin;box-shadow:0 1.2vmin 2vmin rgba(0,0,0,.2)}
body[data-skin="night"] .plank,body[data-skin="dream"] .plank{height:5vmin;border-radius:50%;opacity:.8}
body[data-skin="minimal"] .plank{height:.6vmin;box-shadow:none}
/* continuous-quiet streak */
.streak{position:relative;color:var(--hudInk,var(--ink));display:flex;flex-direction:column;gap:.3vmin;transition:transform .3s;transform-origin:left bottom}
.streak small{font-size:2.4vmin;font-weight:800;color:var(--hudSoft,var(--soft))}
.streak b{font-family:var(--f-num);font-weight:800;font-size:11vmin;line-height:.95;font-variant-numeric:tabular-nums;color:var(--hudInk,var(--num))}
.streak .sub{display:flex;flex-direction:column;gap:.2vmin;font-size:2.1vmin;font-weight:700;color:var(--hudSoft,var(--soft));font-variant-numeric:tabular-nums}
.streak .plus{position:absolute;right:-1vmin;top:-1.6vmin;background:var(--gold);color:var(--btnInk);font-weight:900;font-size:2.4vmin;padding:.6vmin 1.6vmin;border-radius:999px;opacity:0;transform:translateY(1vmin) scale(.8);pointer-events:none}
.streak.milestone{transform:scale(1.08)}
.streak.milestone b{color:var(--gold)}
.streak.milestone .plus{animation:plus 1.8s ease-out}
@keyframes plus{0%{opacity:0;transform:translateY(1vmin) scale(.8)}15%{opacity:1;transform:translateY(0) scale(1.05)}80%{opacity:1}100%{opacity:0;transform:translateY(-2vmin) scale(1)}}
.streak.broken b{color:var(--bad)}
.streak.idle{opacity:.55}
.bubble{position:absolute;left:66%;top:4%;z-index:4;font-size:min(6vmin,9vw);background:#fff;color:#2a1a0e;border:.6vmin solid #2a1a0e;border-radius:3vmin;padding:2vmin 3.4vmin;font-size:6vmin;font-weight:900;transform:translateX(-50%) scale(.6);opacity:0;transition:.25s;white-space:nowrap}
.bubble.show{transform:translateX(-50%);opacity:1}
/* sway + breathing (on wrapper; imgs keep their own --pad offset) */
.rock{position:absolute;inset:0;transform-origin:50% 92%;animation:sway 5s ease-in-out infinite}
body[data-stage="light"] .rock{animation-duration:3.8s;--amp:4deg}
body[data-stage="mid"] .rock{--amp:3deg}
body[data-stage="deep"] .rock{animation:breathe 4.2s ease-in-out infinite}
body[data-stage="wake"] .rock{animation:shake .35s linear 4}
body[data-fuss="1"]:not([data-stage="wake"]) .rock{animation:sway 1.1s ease-in-out infinite;--amp:2.6deg}
.fuss{position:absolute;inset:0;pointer-events:none;z-index:3;opacity:0;transition:opacity .4s}

help:`<h2 id="hTitle">胡臺寧靜時光　使用說明</h2>
<div class="hcols"><section><h3>1. 這是什麼</h3><p>投影在教室或圖書館的大螢幕上。<b>越安靜，小動物睡得越熟</b>；太吵，牠就會被吵醒。用可愛的方式取代老師一直喊「安靜」。</p></section>
<section><h3>2. 兩種模式</h3><ul><li><b>時鐘版</b>：平常掛著當時鐘，同時累計今天的安靜時間、吵醒次數。</li><li><b>挑戰版</b>：選 5–60 分鐘（或自訂），按「開始挑戰」倒數。結束時出示「午睡品質」報告，可替全班加分。</li></ul></section>
<section><h3>3. 動畫規則（三段式）</h3><table><tr><th>聲音</th><th>小動物</th><th>連續安靜</th></tr><tr><td>低於虛線（提醒線）</td><td>慢慢入睡，輕輕搖晃；每 30 秒淡出淡入換睡姿，偶爾說夢話</td><td>累積</td></tr><tr><td>音量碰到虛線（提醒線）</td><td>立刻皺眉、冒出 💢 提醒</td><td>不中斷</td></tr><tr><td>虛線以上累計 3 秒（斷斷續續也會累加）</td><td>被吵醒</td><td>歸零</td></tr><tr><td>音量碰到實線（門檻）</td><td>立刻被吵醒</td><td>歸零</td></tr></table><p class="muted">安靜下來後重新入睡，連續安靜從 0 再累積；「最長」紀錄會保留。安靜時，累計的秒數會慢慢消退。</p></section>
<section><h3>4. 連續安靜</h3><p>角色旁的大數字是「目前連續安靜多久」，每滿 1 分鐘會亮一下。下方顯示今天最長紀錄與上次被吵醒的時間，鼓勵孩子挑戰更久。</p></section>
<section><h3>5. 角色、場景與語言</h3><ul><li>右上「角色」：小橘（貓）、胡小呱（青蛙）。</li><li>右上「風格」：換場景背景。</li><li>右上「中／EN／VI」：切換中文、英文、越南文，方便外師使用。</li><li>「午休調暗」降低亮度；「全螢幕」投影用。電腦會記住你的選擇。</li></ul></section>
<section><h3>6. 只聽「多大聲」，不錄音</h3><p>麥克風每秒檢查約 60 次音量，算完立刻丟掉。<b>不錄音、不存檔、不上傳</b>，也聽不出說話內容。</p><table><tr><th>數值</th><th>大約情境</th></tr><tr><td>0–30</td><td>安靜自習、翻書聲</td></tr><tr><td>30–55</td><td>零星小聲說話</td></tr><tr><td>55–80</td><td>正常討論、走動</td></tr><tr><td>80 以上</td><td>大聲喧嘩</td></tr></table><p class="muted">這不是分貝計：電腦、麥克風位置不同，數值就不同，所以每間教室要先「試音」。</p></section>
<section><h3>7. 試音與門檻</h3><ul><li>按「試音」，請全班安靜 10 秒，系統自動設定門檻（實線），提醒線（虛線）固定在門檻下 10。</li><li>午休想更嚴格，把門檻往左拉；討論課往右拉。</li></ul></section>
<section><h3>8. 擺放建議</h3><p>電腦或麥克風放在教室前方中間，別緊貼老師講話的位置。第一次使用瀏覽器會詢問麥克風權限，請按「允許」。</p></section></div>`},

lines:['{s}… so quiet, so cozy~','Thank you, everyone. I’m sleeping so well','Shh… I’m dreaming of a whole library','You’re amazing. I’m almost asleep…','It’s so quiet — can I nap a little longer?','I see lots of good books in my dream','A tiny bit quieter and I’ll float into dreamland','Mmm… who’s reading so hard?','A quiet classroom is my favorite bed','Zzz… soft voices, lovely friends','I dreamed the whole class got star stickers','I feel so safe with you here','The sound of turning pages is like a lullaby','Psst: quiet people are the coolest','Phew~ today’s dream is rainbow-colored','My ears are resting. Thank you!','One more minute — let’s break the record!','Shh~ even the stars in my dream are asleep','Such gentle quiet, like cotton candy','I’m cheering for you in my dream','Soft and light, like a feather','You shine when you focus','After my nap, I’ll play with you','Quiet is the best gift for me','Dreaming of walking on clouds…','We make a great team!','{s}, {s}… so happy','Reading sounds are the nicest sounds','We’re the quietest class ever!','Good night… oops, good afternoon~'],
help:`<h2 id="hTitle">Hu-Tai Quiet Time · Guide</h2>
<div class="hcols"><section><h3>1. What is it?</h3><p>Show it on the classroom or library screen. <b>The quieter the room, the deeper the little animal sleeps</b>; if it gets too loud, it wakes up. A gentle way to keep the room quiet without the teacher saying “shh” all the time.</p></section>
<section><h3>2. Two modes</h3><ul><li><b>Clock</b>: a classroom clock that also counts today’s quiet time and wake-ups.</li><li><b>Challenge</b>: pick 5–60 minutes (or your own), press “Start challenge” to count down. At the end a nap report appears, and you can give the class a point.</li></ul></section>
<section><h3>3. Animation rules (three levels)</h3><table><tr><th>Sound</th><th>Animal</th><th>Quiet streak</th></tr><tr><td>Below the dashed reminder line</td><td>Falls asleep and sways gently; changes pose with a fade every 30 s and sometimes talks in its sleep</td><td>Keeps counting</td></tr><tr><td>Volume reaches the dashed line</td><td>Frowns right away and shows 💢</td><td>Not broken</td></tr><tr><td>3 s above the dashed line in total (bursts add up)</td><td>Wakes up</td><td>Resets to 0</td></tr><tr><td>Volume reaches the solid line (threshold)</td><td>Wakes up instantly</td><td>Resets to 0</td></tr></table><p class="muted">Once it is quiet again, the animal goes back to sleep and the streak starts from 0. The “Best” record is kept. When the room is quiet, the counted seconds slowly drain away.</p></section>
<section><h3>4. Quiet streak</h3><p>The big number next to the animal shows how long the class has been quiet without a break. It lights up every full minute. Below it you can see today’s best and the last time the animal woke up.</p></section>
<section><h3>5. Characters, scenes and language</h3><ul><li>“Character”: Xiao Ju (cat) or Hu Xiao Gua (frog).</li><li>“Scene”: change the background.</li><li>“中 / EN / VI”: switch between Chinese, English and Vietnamese.</li><li>“Dim” lowers brightness for nap time; “Fullscreen” is for projecting. The computer remembers your choices.</li></ul></section>
<section><h3>6. It only measures loudness — no recording</h3><p>The microphone checks the volume about 60 times a second and throws the number away right after. <b>Nothing is recorded, saved or uploaded</b>, and it cannot understand speech.</p><table><tr><th>Value</th><th>Roughly</th></tr><tr><td>0–30</td><td>Silent reading, turning pages</td></tr><tr><td>30–55</td><td>A few whispers</td></tr><tr><td>55–80</td><td>Normal discussion, walking around</td></tr><tr><td>80+</td><td>Loud talking</td></tr></table><p class="muted">These are not decibels: values change with the computer and microphone position, so calibrate in each room.</p></section>
<section><h3>7. Calibrate and threshold</h3><ul><li>Press “Calibrate” and ask the class to stay quiet for 10 seconds. The threshold (solid line) is set automatically; the reminder line (dashed) is always 10 below it.</li><li>For a stricter nap time, drag the threshold left; for group work, drag it right.</li></ul></section>
<section><h3>8. Placement tips</h3><p>Put the computer or microphone at the front centre of the room, not right next to where the teacher speaks. The first time, the browser asks for microphone permission — choose “Allow”.</p></section></div>`},

help:`<h2 id="hTitle">Giờ Yên Lặng Hồ-Đài · Hướng dẫn</h2>
<div class="hcols"><section><h3>1. Đây là gì?</h3><p>Chiếu lên màn hình lớn của lớp học hoặc thư viện. <b>Lớp càng yên lặng, bạn thú nhỏ ngủ càng say</b>; ồn quá thì bạn ấy sẽ thức giấc. Một cách dễ thương để giữ trật tự mà giáo viên không phải nhắc “im lặng” liên tục.</p></section>
<section><h3>2. Hai chế độ</h3><ul><li><b>Đồng hồ</b>: làm đồng hồ lớp học, đồng thời đếm thời gian yên lặng và số lần bị đánh thức trong ngày.</li><li><b>Thử thách</b>: chọn 5–60 phút (hoặc tự nhập), nhấn “Bắt đầu thử thách” để đếm ngược. Kết thúc sẽ có báo cáo giấc ngủ, có thể cộng điểm cho cả lớp.</li></ul></section>
<section><h3>3. Quy tắc hoạt hình (ba mức)</h3><table><tr><th>Âm thanh</th><th>Thú nhỏ</th><th>Chuỗi yên lặng</th></tr><tr><td>Dưới vạch nhắc (nét đứt)</td><td>Ngủ dần, đung đưa nhẹ; mỗi 30 giây mờ dần đổi tư thế, thỉnh thoảng nói mớ</td><td>Tiếp tục đếm</td></tr><tr><td>Âm lượng chạm vạch nhắc (nét đứt)</td><td>Nhăn mặt ngay, hiện 💢</td><td>Không bị ngắt</td></tr><tr><td>Trên vạch nhắc tổng cộng 3 giây (ngắt quãng vẫn cộng dồn)</td><td>Thức giấc</td><td>Về 0</td></tr><tr><td>Âm lượng chạm ngưỡng (nét liền)</td><td>Thức giấc ngay</td><td>Về 0</td></tr></table><p class="muted">Khi lớp yên lặng trở lại, thú nhỏ ngủ lại và chuỗi yên lặng đếm lại từ 0; kỷ lục “Dài nhất” vẫn được giữ. Khi lớp yên lặng, số giây đã cộng sẽ giảm dần.</p></section>
<section><h3>4. Chuỗi yên lặng</h3><p>Con số lớn bên cạnh thú nhỏ là thời gian cả lớp yên lặng liên tục, sáng lên mỗi khi tròn 1 phút. Bên dưới là kỷ lục hôm nay và lần bị đánh thức gần nhất.</p></section>
<section><h3>5. Nhân vật, cảnh và ngôn ngữ</h3><ul><li>“Nhân vật”: Xiao Ju (mèo) hoặc Hu Xiao Gua (ếch).</li><li>“Cảnh”: đổi hình nền.</li><li>“中 / EN / VI”: chuyển tiếng Trung, tiếng Anh, tiếng Việt.</li><li>“Giảm sáng” cho giờ nghỉ trưa; “Toàn màn hình” để chiếu. Máy tính sẽ nhớ lựa chọn của bạn.</li></ul></section>
<section><h3>6. Chỉ đo độ ồn, không ghi âm</h3><p>Micro kiểm tra âm lượng khoảng 60 lần mỗi giây và xóa ngay sau khi tính. <b>Không ghi âm, không lưu, không tải lên</b>, cũng không nghe được nội dung lời nói.</p><table><tr><th>Giá trị</th><th>Tình huống</th></tr><tr><td>0–30</td><td>Tự học yên lặng, lật sách</td></tr><tr><td>30–55</td><td>Vài tiếng thì thầm</td></tr><tr><td>55–80</td><td>Thảo luận bình thường, đi lại</td></tr><tr><td>Trên 80</td><td>Nói chuyện lớn tiếng</td></tr></table><p class="muted">Đây không phải đơn vị decibel: giá trị thay đổi theo máy tính và vị trí micro, nên mỗi lớp cần “Đo nền” trước.</p></section>
<section><h3>7. Đo nền và ngưỡng</h3><ul><li>Nhấn “Đo nền”, cả lớp im lặng 10 giây; hệ thống tự đặt ngưỡng (nét liền), vạch nhắc (nét đứt) luôn thấp hơn ngưỡng 10.</li><li>Giờ nghỉ trưa muốn nghiêm hơn thì kéo ngưỡng sang trái; giờ thảo luận thì kéo sang phải.</li></ul></section>
<section><h3>8. Gợi ý đặt máy</h3><p>Đặt máy tính hoặc micro ở giữa phía trước lớp, không sát chỗ giáo viên nói. Lần đầu trình duyệt sẽ hỏi quyền dùng micro, hãy chọn “Cho phép”.</p></section></div>`}

/* microphone */
async function openMic(){
  if(analyser) return true;
  try{
    const s=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
    const ctx=new (window.AudioContext||window.webkitAudioContext)();
    audioCtx=ctx; if(ctx.state==='suspended'){try{await ctx.resume()}catch(e){}}
    const node=ctx.createMediaStreamSource(s); analyser=ctx.createAnalyser(); analyser.fftSize=1024; buf=new Float32Array(analyser.fftSize); node.connect(analyser);
    usingFake=false; $('demo').hidden=true; micState='on'; $('micBtn').textContent=T('micOn'); $('micBtn').disabled=true; return true;
  }catch(e){
    usingFake=true; $('demo').hidden=false; micState='retry'; $('micBtn').textContent=T('micRetry'); return false;
  }
}
$('micBtn').addEventListener('click',openMic);
/* iOS/Safari: wake the audio engine on the first tap anywhere */

['touchend','click','keydown'].forEach(ev=>document.addEventListener(ev,()=>{try{if(audioCtx&&audioCtx.state!=='running')audioCtx.resume()}catch(e){} if(!analyser&&!usingFake) openMic();},{passive:true}));

/* calibration: 10 s of quiet -> threshold = 90th percentile + 18 */
let cal=null;
$('calBtn').onclick=async()=>{
  if(cal) return;
  if(!analyser&&!usingFake) await openMic();
  cal={until:performance.now()+10000,samples:[]};
  $('calBtn').classList.add('busy'); $('calMsg').textContent=T('calAsk');
};
function calTick(now){
  if(!cal) return false;
  cal.samples.push(vol);
  const left=Math.ceil((cal.until-now)/1000);
  $('calBtn').textContent=left>0?T('calIng')+' '+left:T('cal');
  if(now>=cal.until){
    const a=cal.samples.slice().sort((x,y)=>x-y), p90=a[Math.floor(a.length*.9)]||0;
    const t=Math.round(Math.max(20,Math.min(90,p90+18)));
    th.value=t; drawTh();
    $('calMsg').textContent=T('calDone',{b:Math.round(p90),t});
    $('calBtn').classList.remove('busy'); $('calBtn').textContent=T('cal'); cal=null;
    setTimeout(()=>{if(!cal)$('calMsg').textContent=''},12000);
  }
  return true;
}
let readVol=function(){
  if(!analyser) return usingFake?+$('fake').value:0;
  analyser.getFloatTimeDomainData(buf); let s=0; for(let i=0;i<buf.length;i++) s+=buf[i]*buf[i];
  const db=20*Math.log10(Math.sqrt(s/buf.length)+1e-8); return Math.max(0,Math.min(100,(db+75)*1.6));
}

/* report */
function showReport(r){

  $('rQuiet').textContent=q+'%'; $('rWakes').textContent=r.wakes; $('rDeep').textContent=NAME[r.deep]; {const t=Math.floor(chBest);$('rStreak').textContent=Math.floor(t/60)+':'+String(t%60).padStart(2,'0')}
  const good=r.deep==='deep'&&r.wakes<=2, ok=r.deep!=='light';

  $('rImg').src=src(good?pick(POOL.deep):ok?pick(POOL.mid):pick([2,3,6]));
  $('rTitle').textContent=r.total>=1800?T('r_titleNap',{n:NM()}):T('r_title',{n:NM()});
  $('report').hidden=false; drawCurve(r);
}
function drawCurve(r){
  const c=$('curve'),g=c.getContext('2d'),W=c.width,H=c.height,pad=36;const cs=getComputedStyle(document.body),tk=n=>cs.getPropertyValue(n).trim();
  g.clearRect(0,0,W,H);
  const y=v=>H-pad-(v/100)*(H-pad*2);
  g.font='22px sans-serif'; g.fillStyle=tk('--soft');
  [[30,T('st_light')],[70,T('st_mid')],[100,T('st_deep')]].forEach(([v,t])=>{g.strokeStyle=tk('--line');g.lineWidth=2;g.beginPath();g.moveTo(pad+40,y(v));g.lineTo(W-pad,y(v));g.stroke();g.fillText(t,0,y(v-15)+8)});
  const tr=r.trace; if(tr.length<2) return;
  const x=i=>pad+40+(i/(tr.length-1))*(W-pad*2-40);
  g.beginPath(); g.moveTo(x(0),y(0)); tr.forEach((p,i)=>g.lineTo(x(i),y(p.s))); g.lineTo(x(tr.length-1),y(0)); g.closePath();
  g.globalAlpha=.25; g.fillStyle=tk('--good'); g.fill(); g.globalAlpha=1;
  g.beginPath(); tr.forEach((p,i)=>i?g.lineTo(x(i),y(p.s)):g.moveTo(x(i),y(p.s))); g.strokeStyle=tk('--good'); g.lineWidth=4; g.stroke();
  g.fillStyle=tk('--bad'); tr.forEach((p,i)=>{if(p.w){g.beginPath();g.arc(x(i),y(p.s)-14,9,0,7);g.fill()}});
  g.fillStyle=tk('--soft'); g.fillText(T('curveStart'),pad+40,H-6); const m=Math.round(r.elapsed/60); g.textAlign='right'; g.fillText(T('curveMin',{m}),W-pad,H-6); g.textAlign='left';
}

/* sleep-talk lines: shown under the big state word while quiet, rotating every 15 s */
let sayIdx=-1, sayAt=0, sayOn=false, quietSince=0;
const sayText=i=>L.lines[i].split('{s}').join(L.snore[CK]);
function sayTick(now,ok){
  const el=$('sayLine');
  if(!ok){ quietSince=0; if(sayOn){sayOn=false;el.classList.remove('on')} return }
  if(!quietSince) quietSince=now;
  if(now-quietSince<6000) return;
  if(!sayOn||now-sayAt>15000){
    let i; do{ i=Math.floor(Math.random()*L.lines.length) }while(i===sayIdx&&L.lines.length>1);
    sayIdx=i; sayAt=now;
    if(sayOn){ el.classList.remove('on'); setTimeout(()=>{el.textContent=sayText(sayIdx); el.classList.add('on')},800) }
    else { el.textContent=sayText(sayIdx); el.classList.add('on') }
    sayOn=true;
  }
}

/* main loop */
const WEEK='日一二三四五六';
let last=performance.now();
function tick(now){
  const dt=Math.min(.25,(now-last)/1000); last=now;
  const raw=readVol(); vol=vol*.6+raw*.4;
  /* rules: touching the solid line = woken instantly; at/above the dashed line = frown, and 3 s of it (added up, even in bursts) = woken */
  const peak=Math.max(raw,vol), loud=peak>=+th.value, warn=peak>=remindOf(), live=!!analyser||usingFake;
  $('lvl').style.width=vol+'%'; $('lvl').classList.toggle('loud',loud); $('lvl').classList.toggle('warn',warn&&!loud);

  const running=ch&&ch.running&&!ch.paused;
  const calibrating=calTick(now);
  const tracking=live&&!calibrating&&(mode==='clock'||running);
  loudFor=loud?loudFor+dt:0;
  /* small-noise meter: time above the dashed line adds up; quiet only drains it slowly, so on-off chatter still counts */
  if(!tracking) fussFor=0; else if(warn) fussFor+=dt; else fussFor=Math.max(0,fussFor-dt*FUSS_LEAK);
  const bigNoise=tracking&&loud, longFuss=fussFor>=FUSS_LIMIT;
  const breakNow=tracking&&(bigNoise||longFuss);
  if(longFuss) fussFor=0;
  if(tracking&&!breakNow&&warn) fussUntil=now+FUSS_HOLD;
  fussing=tracking&&!breakNow&&now<fussUntil;
  let woke=false;
  if(tracking){
    if(breakNow){
      wakeCause=bigNoise?'big':'long';
      /* keep the grumpy pose on screen for as long as the noise lasts (+2.6 s after) */
      const fresh=now>=wakeShowUntil;
      wakeShowUntil=now+2600;
      if(fresh&&sleep>15) woke=true; /* one wake per noisy episode */
      if(fresh||now-wakePoseAt>5000){ show(pick(POOL.wake.filter(n=>n!==shown)),NM()+' '+T('st_wake')); wakePoseAt=now }
      if(now-lastWake>3000){
        lastWake=now; sleep=Math.min(sleep*.4,25);
        cryUntil=now+1800;
      }
    }else if(!warn) sleep=Math.min(100,sleep+dt*.8); /* sleep gain pauses while fussing */
  }
  if(woke){ today.wakes++; if(running) ch.wakes++; }
  /* continuous-quiet streak: breaks on a noisy episode (>=0.5 s), otherwise keeps counting */
  if(tracking){
    if(breakNow){
      fussUntil=0;
      if(streak>0){ lastWakeAt=new Date(); $('streak').classList.add('broken'); setTimeout(()=>$('streak').classList.remove('broken'),1500) }
      streak=0; streakMin=0;
    }else{
      streak+=dt; if(streak>bestStreak) bestStreak=streak; if(running&&streak>chBest) chBest=streak;
      const m=Math.floor(streak/60);
      if(m>streakMin){ streakMin=m; const el=$('streak'); el.classList.remove('milestone'); void el.offsetWidth; el.classList.add('milestone'); setTimeout(()=>el.classList.remove('milestone'),1800) }
    }
  }
  $('streak').classList.toggle('idle',!tracking);
  /* today stats (clock) */
  const d=new Date();
  if(d.toDateString()!==today.day){today.day=d.toDateString();today.quiet=0;today.total=0;today.wakes=0;bestStreak=0;lastWakeAt=null}
  if(live&&mode==='clock'){today.total+=dt; if(!loud) today.quiet+=dt}
  /* challenge */
  if(running){
    ch.left-=dt; ch.elapsed+=dt; if(!loud) ch.quiet+=dt;
    const st=stageOf(sleep); if((st==='deep')||(st==='mid'&&ch.deep==='light')) ch.deep=st;
    if(ch.elapsed-ch.lastSample>=Math.max(1,ch.total/240)||woke){ch.trace.push({s:sleep,w:woke});ch.lastSample=ch.elapsed}
    $('countdown').textContent=fmt(ch.left);
    if(ch.left<=0) endRun(true);
  }
  /* cat */
  const waking=now<wakeShowUntil;
  const st=waking?'wake':stageOf(sleep);
  if(!waking&&(st!==stage||now-stageSince>QUIET_ROTATE)){ const same=st===stage; stage=st; stageSince=now; show(pick(same?POOL[st].filter(n=>n!==shown):POOL[st]),NM()+' '+NAME[st]) }
  if(waking) stage='wake';
  const fz=fussing&&stage!=='wake';
  $('pillText').textContent=stage==='wake'&&now<cryUntil?L.cries[CK]:fz?T('st_fuss'):NAME[stage];
  sayTick(now,live&&!fz&&stage!=='wake');
  document.body.dataset.stage=stage; document.body.dataset.fuss=fz?'1':'0';
  const P={n:NM()}, msg=stage==='wake'?(wakeCause==='long'?T('msg_wakeLong',P):T('msg_wake',P)):fz?T('msg_fuss',P):stage==='deep'?T('msg_deep',P):stage==='mid'?T('msg_mid',P):T('msg_light',P);
  $('clockStatus').textContent=live?msg:T('msg_nomic');
  if(running) $('chalStatus').textContent=msg;
  /* clock text */
  const hh=String(d.getHours()).padStart(2,'0'),mm=String(d.getMinutes()).padStart(2,'0'),ss=String(d.getSeconds()).padStart(2,'0');
  const key=hh+mm+ss;
  if(key!==lastClock){lastClock=key;
    $('clockTime').innerHTML=hh+':'+mm+'<span>:'+ss+'</span>';
    $('clockDate').textContent=L.date(d);
    const qm=Math.floor(today.quiet/60); $('cQuiet').textContent=Math.floor(qm/60)+':'+String(qm%60).padStart(2,'0');
    const mmss=t=>{t=Math.floor(t);const h=Math.floor(t/3600),m=Math.floor(t%3600/60),x=String(t%60).padStart(2,'0');return h?h+':'+String(m).padStart(2,'0')+':'+x:m+':'+x};
    $('streakTime').textContent=mmss(streak); $('streakBest').textContent=T('best',{x:mmss(bestStreak)});
    if(lastWakeAt){const ago=Math.floor((d-lastWakeAt)/60000);$('lastWake').textContent=T('lastWake',{hm:String(lastWakeAt.getHours()).padStart(2,'0')+':'+String(lastWakeAt.getMinutes()).padStart(2,'0'),ago:ago<1?T('justNow'):T('minsAgo',{n:ago})})} else $('lastWake').textContent=T('noWake');
    $('cWakes').textContent=today.wakes; $('cRatio').textContent=today.total>30?Math.round(today.quiet/today.total*100)+'%':'—';
  }
  requestAnimationFrame(tick);
}
